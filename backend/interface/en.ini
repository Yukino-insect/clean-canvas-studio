TextRegionAspectDifferencePixels = Height-Width Pixel Difference Threshold
TextRegionAspectDifferencePixelsDesc = Determines non-subtitle regions (default 10). Subtitles generally have longer text boxes; if height exceeds width beyond this threshold, considered false detection.
OcrMaskPadding = Allowed Pixel Offset
OcrMaskPaddingDesc = Enlarge mask size to prevent residual text edges during inpaint (default 10).
TextLineHeightTolerancePixels = Same-line Subtitle Height Difference Threshold
TextLineHeightTolerancePixelsDesc = Determines if two text boxes belong to the same subtitle line (default 20 pixels).
TextRegionVerticalTolerancePixels = Y-axis Pixel Tolerance
TextRegionVerticalTolerancePixelsDesc = Determines similarity between subtitle boxes on Y-axis (default 20 pixels).
TextRegionHorizontalTolerancePixels = X-axis Pixel Tolerance
TextRegionHorizontalTolerancePixelsDesc = Determines similarity between subtitle boxes on X-axis (default 20 pixels).
TextTimelineBackwardFrameCount = Timeline Backward Frames
TextTimelineBackwardFrameCountDesc = Add frames before detected subtitles to handle slow fade-ins (default 3 frames).
textTimelineForwardFrameCount = Timeline Forward Frames
textTimelineForwardFrameCountDesc = Add frames after detected subtitles to handle slow fade-outs (default 3 frames).
